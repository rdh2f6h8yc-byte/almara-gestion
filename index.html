<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<style>
:root{
  --navy:#0b1f3a;--navy2:#132b4f;--accent:#1e88e5;--accent2:#e3f0fc;
  --bg:#f3f5f9;--card:#fff;--text:#0f1b2d;--muted:#64748b;--line:#e2e8f0;
  --ok:#16a34a;--okbg:#dcfce7;--warn:#d97706;--warnbg:#fef3c7;--bad:#dc2626;--badbg:#fee2e2;
  --r:14px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
header.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:12px}
.brand{font-weight:800;letter-spacing:.06em;font-size:17px}
.brand small{display:block;font-weight:500;letter-spacing:.02em;font-size:11px;opacity:.7}
.top .sp{flex:1}
.top select{background:var(--navy2);border:1px solid #2a4570;color:#fff;border-radius:10px;padding:6px 10px}
.sync{font-size:11px;padding:4px 8px;border-radius:99px;background:var(--navy2);opacity:.9;white-space:nowrap}
.sync.on{background:#14532d}.sync.err{background:#7f1d1d}
.layout{display:flex;min-height:calc(100vh - 56px)}
nav.side{display:none}
main{flex:1;padding:16px 16px calc(90px + var(--safe-b));max-width:1100px;margin:0 auto;width:100%}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b)}
nav.tabs button,nav.side button{flex:1;background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);cursor:pointer}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.act{color:var(--accent);font-weight:600}
@media(min-width:900px){
  nav.tabs{display:none}
  nav.side{display:flex;flex-direction:column;gap:4px;width:210px;padding:16px 10px;background:#fff;border-right:1px solid var(--line);position:sticky;top:56px;height:calc(100vh - 56px)}
  nav.side button{flex:none;flex-direction:row;justify-content:flex-start;gap:10px;font-size:14px;padding:10px 12px;border-radius:10px}
  nav.side button.act{background:var(--accent2)}
  main{padding:24px 28px 40px}
}
h1{font-size:22px;font-weight:800;margin-bottom:4px}
h2{font-size:16px;font-weight:700;margin-bottom:10px}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted);margin-bottom:4px}
.kpi .v{font-size:20px;font-weight:700}
.kpi.hl{background:var(--navy);color:#fff;border-color:var(--navy)}
.kpi.hl .l{color:#b6c6de}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .sp{flex:1}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff;display:inline-flex;align-items:center;gap:6px}
.btn.sec{background:var(--accent2);color:var(--accent)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.del{background:var(--badbg);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.list .it{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}

.pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.info{background:var(--accent2);color:var(--accent)}

.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.seg button.act{background:#fff;color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
table.cas{width:100%;border-collapse:collapse;font-size:14px}
table.cas td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.cas td:first-child{color:var(--muted);width:46px;font-size:12px;padding-top:10px}
table.cas td:last-child{text-align:right;font-weight:600;white-space:nowrap}
table.cas tr.tot td{border-bottom:0;font-weight:800;font-size:16px;color:var(--text)}
.result{margin-top:12px;padding:12px 14px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.result.pay{background:var(--warnbg);color:#92400e}.result.zero{background:var(--okbg);color:#166534}.result.neg{background:var(--accent2);color:#0d47a1}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
.cal .it{cursor:default}
.date{width:46px;text-align:center;border-radius:10px;background:var(--accent2);color:var(--accent);padding:5px 0;line-height:1.1}
.date b{display:block;font-size:17px}.date span{font-size:10px;text-transform:uppercase;font-weight:700}
.date.past{background:#eef1f5;color:var(--muted)}.date.soon{background:var(--warnbg);color:var(--warn)}
/* forms */
.f{display:grid;gap:12px}
.f .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
label.fl{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:600;color:var(--muted)}
.fl input,.fl select,.fl textarea{border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff;font-size:15px;font-weight:400;color:var(--text);width:100%}
.fl input:focus,.fl select:focus,.fl textarea:focus{outline:2px solid var(--accent2);border-color:var(--accent)}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.lines .ln{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;position:relative;background:#fafbfd}
.lines .ln .x{position:absolute;top:6px;right:8px;border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer}
.ln .g4{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px}
.totbox{background:#f6f8fb;border-radius:12px;padding:12px;font-size:14px}
.totbox div{display:flex;justify-content:space-between;padding:3px 0}
.totbox .big{font-weight:800;font-size:17px;border-top:1px solid var(--line);margin-top:4px;padding-top:7px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(11,31,58,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.ov{align-items:center}}
.md{background:#fff;width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + var(--safe-b))}
@media(min-width:700px){.md{border-radius:18px;padding:22px}}
.md .hd{display:flex;align-items:center;margin-bottom:14px}
.md .hd h2{margin:0;flex:1}
.md .ft{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.md .ft .sp{flex:1}
.spin{width:34px;height:34px;border:3px solid var(--accent2);border-top-color:var(--accent);border-radius:50%;margin:6px auto 0;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.search{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;background:#fff}
/* invoice print */
#printArea{display:none}
.inv{font-family:Inter,Arial,sans-serif;color:#0f1b2d;padding:36px 40px;max-width:800px;margin:0 auto;background:#fff;font-size:13px}
.inv .ih{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #0b1f3a;padding-bottom:16px;margin-bottom:20px}
.inv .logo{font-size:28px;font-weight:800;letter-spacing:.08em;color:#0b1f3a}
.inv .em{font-size:12px;color:#475569;line-height:1.55;margin-top:6px}
.inv .tt{text-align:right}
.inv .tt h3{font-size:22px;color:#0b1f3a;letter-spacing:.05em}
.inv .tt div{font-size:12.5px;color:#475569;margin-top:3px}
.inv .cl{background:#f3f6fa;border-radius:8px;padding:12px 14px;margin-bottom:20px;line-height:1.55}
.inv .cl b{font-size:11px;color:#64748b;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:3px}
.inv table{width:100%;border-collapse:collapse;margin-bottom:18px}
.inv th{background:#0b1f3a;color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:8px;text-align:left}
.inv td{padding:9px 8px;border-bottom:1px solid #e2e8f0}
.inv .r{text-align:right;white-space:nowrap}
.inv .tots{margin-left:auto;width:290px}
.inv .tots div{display:flex;justify-content:space-between;padding:4px 0}
.inv .tots .big{font-size:17px;font-weight:800;border-top:2px solid #0b1f3a;margin-top:6px;padding-top:8px}
.inv .ftx{margin-top:28px;font-size:11.5px;color:#475569;line-height:1.6;border-top:1px solid #e2e8f0;padding-top:12px}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  .inv{padding:0}
  @page{margin:16mm}
}
</style>

<body>
<header class="top">
  <div class="brand">ALMARA<small>Gestión del autónomo</small></div>
  <div class="sp"></div>
  <span id="syncBadge" class="sync" onclick="if(Cloud.lastError&&this.classList.contains('err'))toast(Cloud.lastError)" style="cursor:pointer">Local</span>
  <select id="yearSel" aria-label="Año"></select>
</header>
<div class="layout">
  <nav class="side" id="sideNav"></nav>
  <main id="view"></main>
</div>
<nav class="tabs" id="tabNav"></nav>
<div id="modalRoot"></div>
<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script>
/* ============ Utilidades ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = n => Math.round((+n || 0) * 100) / 100;
const eur = n => (r2(n)).toLocaleString('es-ES', {style:'currency', currency:'EUR'});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const today = () => new Date().toISOString().slice(0, 10);
const fdate = d => d ? d.split('-').reverse().join('/') : '';
const qOf = d => Math.floor((+d.slice(5, 7) - 1) / 3) + 1;
const yOf = d => +d.slice(0, 4);
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

/* ============ Datos ============ */
const DEFAULT = {
  settings: {
    nombre: 'Alin Nicusor Florei', apellidos: 'Florei', nombrePila: 'Alin Nicusor', comercial: 'ALMARA', nif: '', domiciliar: false,
    direccion: 'Calle Valls d’Andorra, 58', cp: '25005', ciudad: 'Lleida', provincia: 'Lleida',
    telefono: '623 916 122', email: 'contacto@almara.group', web: '', iban: '',
    serie: 'F', irpfDefecto: 0, ivaDefecto: 21, cuotaAutonomo: 0,
    gdj: true, rendAnterior: '', pieFactura: 'Pago por transferencia bancaria en un plazo de 15 días desde la fecha de factura.',
    sbUrl: '', sbKey: ''
  },
  facturas: [], gastos: [], updatedAt: 0
};
let S = LS.get('almara_gestion', null) || structuredClone(DEFAULT);
S.settings = Object.assign({}, DEFAULT.settings, S.settings || {});
S.facturas ||= []; S.gastos ||= [];
let YEAR = new Date().getFullYear();
let VIEW = 'inicio';
let QSEL = Math.min(4, qOf(today()));

function save(silent){
  S.updatedAt = Date.now();
  LS.set('almara_gestion', S);
  if (Cloud.session) Cloud.queuePush();
  if (!silent) render();
}

/* ============ Cálculos ============ */
const IVA_OPTS = [['21','21 %'],['10','10 %'],['4','4 %'],['0','0 % / exento'],['isp','Inversión sujeto pasivo']];
function facTotals(f){
  const groups = {}; let base = 0, cuota = 0, baseIsp = 0;
  (f.lineas || []).forEach(l => {
    const b = r2((+l.q || 0) * (+l.p || 0));
    base += b;
    if (l.iva === 'isp'){ baseIsp += b; return; }
    const t = +l.iva || 0, c = r2(b * t / 100);
    groups[t] ||= {base:0, cuota:0}; groups[t].base += b; groups[t].cuota += c; cuota += c;
  });
  const ret = r2(base * (+f.irpf || 0) / 100);
  return {groups, base:r2(base), cuota:r2(cuota), baseIsp:r2(baseIsp), ret, total:r2(base + cuota - ret)};
}
function gasTotals(g){
  const base = +g.base || 0, cuota = r2(base * (+g.iva || 0) / 100);
  const ivaDed = r2(cuota * (+g.ivaDed ?? 100) / 100);
  const gastoIrpf = r2((base + (cuota - ivaDed)) * (+g.irpfDed ?? 100) / 100);
  return {base, cuota, ivaDed, gastoIrpf, total:r2(base + cuota)};
}
const inQ = (d, y, q) => yOf(d) === y && qOf(d) === q;
const upToQ = (d, y, q) => yOf(d) === y && qOf(d) <= q;

function m303(y, q){
  const dev = {}; let devTot = 0, isp = 0;
  S.facturas.filter(f => inQ(f.fecha, y, q)).forEach(f => {
    const t = facTotals(f); isp += t.baseIsp;
    for (const k in t.groups){ dev[k] ||= {base:0,cuota:0}; dev[k].base += t.groups[k].base; dev[k].cuota += t.groups[k].cuota; devTot += t.groups[k].cuota; }
  });
  let baseDed = 0, cuotaDed = 0;
  S.gastos.filter(g => inQ(g.fecha, y, q)).forEach(g => { const t = gasTotals(g); if (t.ivaDed > 0){ baseDed += t.base * (+g.ivaDed ?? 100) / 100; cuotaDed += t.ivaDed; } });
  const diff = r2(devTot - cuotaDed); // casilla 46 (= 64 = 66 al 100 %)
  // Cuotas a compensar de periodos anteriores (se arrastran trimestre a trimestre y de un año a otro)
  let c110 = 0;
  const prev = q > 1 ? m303(y, q - 1) : (y - 1 >= minYear() ? m303(y - 1, 4) : null);
  if (prev) c110 = prev.pendiente;
  const c78 = r2(diff > 0 ? Math.min(c110, diff) : 0);
  const c87 = r2(c110 - c78);
  const resultado = r2(diff - c78); // casilla 69 = 71
  const pendiente = r2(c87 + (resultado < 0 ? -resultado : 0));
  const sinActividad = !devTot && !cuotaDed && !isp;
  return {dev, devTot:r2(devTot), isp:r2(isp), baseDed:r2(baseDed), cuotaDed:r2(cuotaDed), diff, c110:r2(c110), comp:c78, c78, c87, resultado, pendiente, sinActividad};
}
function minYear(){
  let m = new Date().getFullYear();
  S.facturas.forEach(f => m = Math.min(m, yOf(f.fecha))); S.gastos.forEach(g => m = Math.min(m, yOf(g.fecha)));
  return m;
}
function m130(y, q){
  let ing = 0, gas = 0, ret = 0;
  S.facturas.filter(f => upToQ(f.fecha, y, q)).forEach(f => { const t = facTotals(f); ing += t.base; ret += t.ret; });
  S.gastos.filter(g => upToQ(g.fecha, y, q)).forEach(g => { gas += gasTotals(g).gastoIrpf; });
  const previo = ing - gas;
  const gdj = S.settings.gdj && previo > 0 ? Math.min(2000, previo * 0.05) : 0;
  const c03 = r2(previo - gdj);
  const c04 = c03 > 0 ? r2(c03 * 0.20) : 0;
  let c05 = 0; // suma de las casillas 07 positivas de los trimestres anteriores
  for (let i = 1; i < q; i++){ const p = m130(y, i); if (p.c07 > 0) c05 += p.c07; }
  const c06 = r2(ret);
  const c07 = r2(c04 - c05 - c06);
  let ded = 0; const ra = S.settings.rendAnterior;
  if (ra !== '' && ra != null){ const v = +ra; ded = v <= 9000 ? 100 : v <= 10000 ? 75 : v <= 11000 ? 50 : v <= 12000 ? 25 : 0; }
  const c13 = r2(c07 > 0 ? Math.min(ded, c07) : 0);
  const res = r2(c07 - c13); // casillas 14 = 17 = 19
  const final = r2(Math.max(0, res));
  return {ing:r2(ing), gas:r2(gas), gdj:r2(gdj), c02:r2(gas + gdj), c03, c04, c05:r2(c05), c06, c07, c13, res, final};
}
function yearSummary(y){
  let ing = 0, iva = 0, ret = 0, gas = 0, cobrado = 0, pendiente = 0, nPend = 0;
  S.facturas.filter(f => yOf(f.fecha) === y).forEach(f => { const t = facTotals(f); ing += t.base; iva += t.cuota; ret += t.ret; if (f.estado === 'cobrada') cobrado += t.total; else { pendiente += t.total; nPend++; } });
  S.gastos.filter(g => yOf(g.fecha) === y).forEach(g => gas += gasTotals(g).gastoIrpf);
  return {ing:r2(ing), iva:r2(iva), ret:r2(ret), gas:r2(gas), ben:r2(ing - gas), cobrado:r2(cobrado), pendiente:r2(pendiente), nPend};
}

/* Calendario fiscal (plazo de presentación; si cae en fin de semana pasa al lunes) */
function workday(d){ const w = d.getDay(); if (w === 6) d.setDate(d.getDate() + 2); if (w === 0) d.setDate(d.getDate() + 1); return d; }
function calendario(y){
  const mk = (yy, m, dd, t, s, q) => ({d: workday(new Date(yy, m - 1, dd)), t, s, q});
  return [
    mk(y, 1, 30, `303 + 130 · 4T ${y-1}`, `Y resumen anual 390 de IVA ${y-1}`, null),
    mk(y, 4, 20, `303 + 130 · 1T ${y}`, 'Enero – marzo', 1),
    mk(y, 6, 30, `Renta ${y-1}`, 'Declaración anual del IRPF (modelo 100)', null),
    mk(y, 7, 20, `303 + 130 · 2T ${y}`, 'Abril – junio', 2),
    mk(y, 10, 20, `303 + 130 · 3T ${y}`, 'Julio – septiembre', 3),
    mk(y + 1, 1, 30, `303 + 130 · 4T ${y}`, `Octubre – diciembre y modelo 390`, 4),
  ];
}

/* ============ Nube (Supabase, opcional) ============ */
const Cloud = {
  session: LS.get('almara_gestion_sb', null), timer: null,
  get url(){ return (S.settings.sbUrl || '').trim().replace(/\/+$/, '').replace(/\/(rest|auth)\/v1.*$/, ''); },
  get key(){ return (S.settings.sbKey || '').trim(); },
  badge(st, txt){ const b = $('#syncBadge'); b.className = 'sync ' + (st || ''); b.textContent = txt; },
  async auth(body, grant){
    if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(this.url)) throw new Error('La URL del proyecto debe ser como https://xxxx.supabase.co');
    const r = await fetch(`${this.url}/auth/v1/token?grant_type=${grant}`, {method:'POST', headers:{apikey:this.key, 'Content-Type':'application/json'}, body:JSON.stringify(body)});
    const j = await r.json().catch(() => ({}));
    if (!r.ok){
      const code = j.error_code || j.code || '', raw = j.error_description || j.msg || j.message || j.error || '';
      const ES = {invalid_credentials:'Correo o contraseña incorrectos (o ese correo no tiene cuenta en este Supabase)', email_not_confirmed:'El correo no está confirmado: confírmalo en Supabase → Authentication → Users', invalid_grant:'Correo o contraseña incorrectos', user_not_found:'Ese correo no tiene cuenta en este Supabase', over_request_rate_limit:'Demasiados intentos: espera unos minutos'};
      let m = ES[code] || (/invalid api key|no api key/i.test(raw) ? 'La clave pública no es correcta: cópiala otra vez' : /invalid login/i.test(raw) ? ES.invalid_credentials : /not confirmed/i.test(raw) ? ES.email_not_confirmed : raw);
      throw new Error((m || 'Error de acceso') + ` (${r.status})`);
    }
    this.session = {at:j.access_token, rt:j.refresh_token, exp:Date.now() + (j.expires_in - 60) * 1000, uid:j.user.id, email:j.user.email};
    LS.set('almara_gestion_sb', this.session); return this.session;
  },
  login(email, password){ return this.auth({email, password}, 'password'); },
  async token(){ if (Date.now() > this.session.exp) await this.auth({refresh_token:this.session.rt}, 'refresh_token'); return this.session.at; },
  async h(){ return {apikey:this.key, Authorization:'Bearer ' + await this.token(), 'Content-Type':'application/json'}; },
  async pull(){
    const r = await fetch(`${this.url}/rest/v1/gestion?user_id=eq.${this.session.uid}&select=data,updated_at`, {headers: await this.h()});
    if (!r.ok){ const j = await r.json().catch(() => ({})); throw new Error(`Error de la nube (${r.status}${j.code ? ' ' + j.code : ''}): ${j.message || ''}`); }
    const rows = await r.json(); return rows[0] || null;
  },
  async push(){
    const data = structuredClone(S); data.settings.sbKey = ''; // la clave no se sube
    const r = await fetch(`${this.url}/rest/v1/gestion`, {method:'POST', headers:{...await this.h(), Prefer:'resolution=merge-duplicates'}, body:JSON.stringify({user_id:this.session.uid, data, updated_at:new Date(S.updatedAt || Date.now()).toISOString()})});
    if (!r.ok) throw new Error('No se pudo guardar en la nube');
  },
  queuePush(){
    clearTimeout(this.timer); this.badge('', 'Guardando…');
    this.timer = setTimeout(async () => { try { await this.push(); this.badge('on', '☁ Sincronizado'); } catch(e){ this.badge('err', 'Sin conexión'); } }, 1200);
  },
  async sync(){
    if (!this.session || !this.url) return;
    try {
      this.badge('', 'Sincronizando…');
      const row = await this.pull();
      const remoteTs = row ? new Date(row.updated_at).getTime() : 0;
      if (row && remoteTs > (S.updatedAt || 0)){
        const keep = {sbUrl:S.settings.sbUrl, sbKey:S.settings.sbKey};
        S = row.data; S.settings = Object.assign({}, DEFAULT.settings, S.settings, keep); S.updatedAt = remoteTs;
        LS.set('almara_gestion', S); render();
      } else if (S.updatedAt > remoteTs){ await this.push(); }
      this.badge('on', '☁ Sincronizado');
    } catch(e){ this.badge('err', 'Error nube'); this.lastError = e.message; toast(e.message); console.warn(e); }
  },
  async upload(path, blob){
    const r = await fetch(`${this.url}/storage/v1/object/facturas/${path}`, {method:'POST', headers:{apikey:this.key, Authorization:'Bearer ' + await this.token(), 'Content-Type':blob.type, 'x-upsert':'true'}, body:blob});
    if (!r.ok) throw new Error('No se pudo guardar la foto');
  },
  async fetchFile(path){
    const r = await fetch(`${this.url}/storage/v1/object/authenticated/facturas/${path}`, {headers:{apikey:this.key, Authorization:'Bearer ' + await this.token()}});
    if (!r.ok) throw new Error('No se encuentra la foto'); return r.blob();
  },
  async remove(path){ try { await fetch(`${this.url}/storage/v1/object/facturas/${path}`, {method:'DELETE', headers:{apikey:this.key, Authorization:'Bearer ' + await this.token()}}); } catch(e){} },
  logout(){ this.session = null; try { localStorage.removeItem('almara_gestion_sb'); } catch(e){} this.badge('', 'Local'); }
};

function calItem(c){
  const now = new Date(); now.setHours(0,0,0,0);
  const days = Math.round((c.d - now) / 864e5);

  const m = c.d.toLocaleDateString('es-ES', {month:'short'}).replace('.', '');
  return `<div class="it"><div class="date ${cls}"><b>${c.d.getDate()}</b><span>${m}</span></div><div class="m"><div class="t">${esc(c.t)}</div><div class="s">${esc(c.s)}${days >= 0 ? ` · ${days === 0 ? 'hoy' : 'en ' + days + ' días'}` : ' · presentado'}</div></div></div>`;

/* ============ Foto de factura → gasto (lectura con IA) ============ */
function b64(blob){ return new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = ko; r.readAsDataURL(blob); }); }
async function prepFile(file){
  if (file.type === 'application/pdf'){
    if (file.size > 3.2e6) throw new Error('El PDF pesa demasiado (máx. 3 MB)');
    return {blob:file, mediaType:'application/pdf', ext:'pdf'};
  }
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, ko) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => ko(new Error('No se puede abrir la imagen')); i.src = url; });
    const max = 1800, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.82));
    return {blob, mediaType:'image/jpeg', ext:'jpg'};
  } finally { URL.revokeObjectURL(url); }
}
function progreso(txt){
  let d = document.getElementById('prog');
  if (!txt){ d && d.remove(); return; }
  if (!d){ d = document.createElement('div'); d.id = 'prog'; d.className = 'ov'; d.style.zIndex = 70; d.innerHTML = '<div class="md" style="max-width:360px;text-align:center"><div class="spin"></div><p id="progTxt" style="margin-top:14px"></p></div>'; document.body.appendChild(d); }
  d.querySelector('#progTxt').textContent = txt;
}
async function fotoGastos(files){
  files = [...(files || [])]; if (!files.length) return;
  if (!Cloud.session){ toast('Para leer facturas con foto, conecta la nube en Ajustes'); return go('ajustes'); }
  const creados = []; let errores = 0;
  for (let i = 0; i < files.length; i++){
    progreso(files.length > 1 ? `Leyendo factura ${i + 1} de ${files.length}…` : 'Leyendo la factura…');
    try {
      const f = await prepFile(files[i]);
      const r = await fetch('/api/leer-factura', {method:'POST', headers:{'Content-Type':'application/json', Authorization:'Bearer ' + await Cloud.token()}, body:JSON.stringify({data: await b64(f.blob), mediaType:f.mediaType})});
      const d = await r.json().catch(() => ({error:'La app no está publicada en Vercel'}));
      if (!r.ok) throw new Error(d.error || 'Error al leer');
      if (d.es_factura === false) throw new Error('Esa foto no parece una factura');
      const fotoId = uid(), path = `${Cloud.session.uid}/${fotoId}.${f.ext}`;
      let foto = '';
      try { await Cloud.upload(path, f.blob); foto = path; } catch(e){ console.warn(e); }
      const des = (d.desglose && d.desglose.length) ? d.desglose : [{tipo_iva:21, base:r2((d.total || 0) / 1.21), cuota:0}];
      const fecha = /^\d{4}-\d{2}-\d{2}$/.test(d.fecha || '') ? d.fecha : today();
      des.forEach((x, k) => {
        const def = GDEF[d.categoria] || {};
        creados.push({id:uid(), fecha, proveedor:d.proveedor || '', nif:(d.nif_proveedor || '').toUpperCase(), num:d.numero || '',
          concepto:(d.concepto || '') + (des.length > 1 ? ` (IVA ${x.tipo_iva} %)` : ''), cat:CATS.includes(d.categoria) ? d.categoria : 'Otros',
          base:r2(x.base), iva:[21,10,4,0].includes(+x.tipo_iva) ? +x.tipo_iva : 21, ivaDed:def.ivaDed ?? 100, irpfDed:def.irpfDed ?? 100,
          foto, revisar:true, aviso: d.ticket_simplificado ? 'Parece un ticket simplificado: para deducir el IVA necesitas la factura completa con tu NIF.' : ''});
      });
    } catch(e){ errores++; toast(e.message); await new Promise(ok => setTimeout(ok, 1500)); }
  }
  progreso('');
  if (creados.length === 1 && files.length === 1){ editGasto(null, creados[0]); toast('Revisa los datos y guarda'); return; }
  if (creados.length){ S.gastos.push(...creados); save(); toast(`${creados.length} gastos añadidos${errores ? `, ${errores} con error` : ''}. Revisa los marcados.`); }
}
async function verFoto(path){
  progreso('Abriendo foto…');
  try {
    const blob = await Cloud.fetchFile(path), url = URL.createObjectURL(blob);
    progreso('');
    const d = document.createElement('div'); d.className = 'ov'; d.style.zIndex = 65;
    d.innerHTML = `<div class="md" style="max-width:720px"><div class="hd"><h2>Factura</h2><button class="btn ghost sm" id="fx">✕</button></div>${blob.type === 'application/pdf' ? `<a class="btn" href="${url}" target="_blank" rel="noopener">Abrir PDF</a>` : `<img src="${url}" style="width:100%;border-radius:10px">`}</div>`;
    document.body.appendChild(d);
    d.querySelector('#fx').onclick = () => { d.remove(); URL.revokeObjectURL(url); };
  } catch(e){ progreso(''); toast(e.message); }
}

function copyText(t){ (navigator.clipboard?.writeText(t) || Promise.reject()).then(() => toast('Copiado'), () => modal(`<div class="hd"><h2>Cifras</h2><button class="btn ghost sm" onclick="closeModal()">✕</button></div><textarea class="search" rows="10" readonly>${esc(t)}</textarea>`)); }
const n2 = v => r2(v).toLocaleString('es-ES', {minimumFractionDigits:2, maximumFractionDigits:2});
function copy303(q){ const a = m303(YEAR, q); let t = `Modelo 303 · ${q}T ${YEAR}\n`; for (const [k, g] of Object.entries(a.dev)) if (+k > 0) t += `Base ${k}%: ${n2(g.base)} · Cuota: ${n2(g.cuota)}\n`; t += `Total devengado (27): ${n2(a.devTot)}\nBase deducible (28): ${n2(a.baseDed)}\nCuota deducible (29): ${n2(a.cuotaDed)}\n${a.isp ? `ISP (122): ${n2(a.isp)}\n` : ''}${a.comp ? `Compensación (110): ${n2(a.comp)}\n` : ''}Resultado: ${n2(a.resultado)}`; copyText(t); }
function copy130(q){ const b = m130(YEAR, q); copyText(`Modelo 130 · ${q}T ${YEAR}\n01: ${n2(b.ing)}\n02: ${n2(b.gas + b.gdj)}\n03: ${n2(b.c03)}\n04: ${n2(b.c04)}\n05: ${n2(b.c05)}\n06: ${n2(b.c06)}\n07: ${n2(b.c07)}\n${b.c13 ? `13: ${n2(b.c13)}\n` : ''}Resultado: ${n2(b.res)}`); }

/* ============ Archivos para importar en la AEAT (diseños de registro oficiales) ============ */
// Texto: solo letras, números y blancos, en mayúsculas, alineado a la izquierda
const fA = (s, n) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim().padEnd(n).slice(0, n);
// Importe: céntimos alineados a la derecha con ceros; si es negativo, "N" en la primera posición
const fN = (v, n = 17) => { const c = String(Math.round(Math.abs(+v || 0) * 100)); return (v < 0 ? 'N' + c.padStart(n - 1, '0') : c.padStart(n, '0')).slice(-n); };
const blanks = n => ' '.repeat(n);
function chk(str, len, name){ if (str.length !== len) throw new Error(`${name}: ${str.length} en vez de ${len}`); return str; }
function nifOk(){ const n = fA(S.settings.nif, 9).trim(); if (n.length < 8){ toast('Pon tu NIF en Ajustes antes de descargar'); go('ajustes'); return null; } return n; }
function cabecera(modelo, y, q, contenido){
  const per = q + 'T', nif = fA(S.settings.nif, 9);
  const aux = '<AUX>' + blanks(70) + '0100' + blanks(4) + nif + blanks(213) + '</AUX>';
  return `<T${modelo}0${y}${per}0000>` + aux + contenido + `</T${modelo}0${y}${per}0000>`;
}
const iban = () => S.settings.domiciliar ? fA(S.settings.iban, 34).replace(/ /g, '') : '';

function file303(q){
  if (!nifOk()) return;
  const y = YEAR, a = m303(y, q), s = S.settings, ult = q === 4;
  const dev = k => a.dev[k] || {base:0, cuota:0};
  const tipo = a.resultado > 0 ? (s.domiciliar && s.iban ? 'U' : 'I') : a.resultado < 0 ? 'C' : 'N';
  const nombre = `${s.apellidos || ''} ${s.nombrePila || s.nombre || ''}`;
  let p1 = '<T30301000>' + ' ' + tipo + fA(s.nif, 9) + fA(nombre, 80) + y + q + 'T'
    + '2' + '2' + '3' + '2' + '2' + '2'          // foral, devolución mensual, solo RG, conjunta, criterio caja, destinatario caja
    + (ult ? '2' : ' ') + (ult ? '2' : ' ')        // prorrata especial: opción / revocación
    + '2' + blanks(8) + ' ' + '2'                  // concurso, fecha auto, tipo concurso, SII
    + (ult ? '2' : '0') + '0' + '0';               // exonerado 390, volumen distinto de cero, gasolinas
  p1 += fN(0) + '00000' + fN(0);                   // [150-152]
  p1 += fN(0) + '00000' + fN(0);                   // [165-167]
  p1 += fN(dev(4).base) + '00400' + fN(dev(4).cuota);     // [01-03]
  p1 += fN(0) + '00000' + fN(0);                          // [153-155]
  p1 += fN(dev(10).base) + '01000' + fN(dev(10).cuota);   // [04-06]
  p1 += fN(dev(21).base) + '02100' + fN(dev(21).cuota);   // [07-09]
  p1 += fN(0) + fN(0) + fN(0) + fN(0) + fN(0) + fN(0);    // [10-15]
  p1 += fN(0) + '00175' + fN(0) + fN(0) + '00050' + fN(0) + fN(0) + '00000' + fN(0) + fN(0) + '00140' + fN(0) + fN(0) + '00520' + fN(0); // recargo equivalencia
  p1 += fN(0) + fN(0);                                    // [25-26]
  p1 += fN(a.devTot);                                     // [27]
  p1 += fN(a.baseDed) + fN(a.cuotaDed);                   // [28-29]
  p1 += fN(0).repeat(10);                                 // [30-39]
  p1 += fN(0) + fN(0) + fN(0) + fN(0) + fN(0);            // [40-44]
  p1 += fN(a.cuotaDed) + fN(a.diff);                      // [45-46]
  p1 += blanks(521) + blanks(13) + '</T30301000>';
  chk(p1, 1581, 'Página 1');
  let p3 = '<T30303000>' + fN(0) + fN(0) + fN(0) + fN(a.isp) + fN(0) + fN(0)   // [59] [60] [120] [122] [123] [124]
    + fN(0) + fN(0) + fN(0) + fN(0) + fN(0)                                      // [62] [63] [74] [75] [76]
    + fN(a.diff) + '10000' + fN(a.diff)                                          // [64] [65] [66]
    + fN(0) + fN(a.c110) + fN(a.c78) + fN(a.c87)                                  // [77] [110] [78] [87]
    + fN(0) + fN(0) + fN(a.resultado) + fN(0) + fN(0) + fN(0) + fN(a.resultado)  // [68] [108] [69] [70] [109] [112] [71]
    + (a.sinActividad ? 'X' : ' ') + ' ' + blanks(13) + ' ' + fN(0) + ' ' + ' '
    + blanks(546) + '</T30303000>';
  chk(p3, 1017, 'Página 3');
  const did = '<T303DID00>' + blanks(11) + (tipo === 'U' ? iban() : '').padEnd(34) + blanks(70) + blanks(35) + blanks(30) + blanks(2) + (tipo === 'U' ? '1' : '0') + blanks(617) + '</T303DID00>';
  chk(did, 823, 'Página DID');
  download('303.txt', cabecera('303', y, q, p1 + p3 + did), 'text/plain');
  toast('303.txt descargado');
}
function file130(q){
  if (!nifOk()) return;
  const y = YEAR, b = m130(y, q), s = S.settings;
  const tipo = b.res > 0 ? (s.domiciliar && s.iban ? 'U' : 'I') : 'N';
  let p = '<T13001000>' + ' ' + tipo + fA(s.nif, 9) + fA(s.apellidos || s.nombre, 60) + fA(s.nombrePila || '', 20) + y + q + 'T'
    + fN(b.ing) + fN(b.c02) + fN(b.c03) + fN(b.c04) + fN(b.c05) + fN(b.c06) + fN(b.c07)   // [01]-[07]
    + fN(0) + fN(0) + fN(0) + fN(0)                                                         // [08]-[11]
    + fN(b.c07) + fN(b.c13) + fN(b.res) + fN(0) + fN(0) + fN(b.res) + fN(0) + fN(b.res)   // [12]-[19]
    + ' ' + blanks(13) + (tipo === 'U' ? iban() : '').padEnd(34) + blanks(96) + blanks(13) + '</T13001000>';
  chk(p, 600, 'Modelo 130');
  download('130.txt', cabecera('130', y, q, p), 'text/plain');
  toast('130.txt descargado');
}

/* ============ Vista: Ajustes ============ */

  $('#view').innerHTML = `

    <div class="card f" id="setForm">
      <h2>Datos del autónomo</h2>
      <div class="g2">${f('nombre','Nombre y apellidos')}${f('nif','NIF','text','Obligatorio en facturas')}</div>

      <label class="fl">Texto al pie de las facturas<textarea data-k="pieFactura" rows="2">${esc(s.pieFactura)}</textarea></label>
      <h2 style="margin-top:6px">Facturación e impuestos</h2>
      <div class="g3">${f('serie','Serie factura')}
        <label class="fl">IVA por defecto<select data-k="ivaDefecto">${['21','10','4','0','isp'].map(v => `<option value="${v}" ${String(s.ivaDefecto)===v?'selected':''}>${v==='isp'?'ISP':v+' %'}</option>`).join('')}</select></label>
        <label class="fl">Retención por defecto<select data-k="irpfDefecto">${[0,7,15].map(v => `<option value="${v}" ${+s.irpfDefecto===v?'selected':''}>${v} %</option>`).join('')}</select></label></div>
      <div class="g2">${f('cuotaAutonomo','Cuota de autónomos mensual (€)','number')}${f('rendAnterior','Rendimiento neto del año pasado (€)','number','Opcional')}</div>
      <label class="chk"><input type="checkbox" data-k="gdj" ${s.gdj?'checked':''}> Aplicar 5 % de gastos de difícil justificación (máx. 2.000 €/año)</label>
      <label class="chk"><input type="checkbox" data-k="domiciliar" ${s.domiciliar?'checked':''}> Domiciliar los pagos del 303 y 130 en mi IBAN (archivos para Hacienda)</label>
      <p class="note">Como instalador (actividad empresarial) lo normal es facturar <b>sin retención</b>. A constructoras, si eres subcontrata en una obra, usa «Inversión sujeto pasivo»: la factura va sin IVA y lo declara la constructora. El rendimiento del año pasado sirve para la deducción del 130 si ganaste menos de 12.000 €.</p>
      <div class="row"><span class="sp"></span><button class="btn" onclick="saveSettings()">Guardar ajustes</button></div>
    </div>
    <div class="card f">
      <h2>Sincronizar en la nube (Supabase)</h2>
      <p class="note" style="margin:0">Para tener los datos en el móvil y el ordenador a la vez. Puedes usar el mismo proyecto de Supabase que la app ALMARA y entrar con tu mismo correo.</p>
      ${logged ? `<div class="row"><span class="pill ok">Conectado</span><span style="font-size:14px">${esc(logged.email)}</span><span class="sp"></span><button class="btn sec sm" onclick="Cloud.sync()">Sincronizar ahora</button><button class="btn ghost sm" onclick="Cloud.logout();render()">Salir</button></div>`
      : `${f('sbUrl','URL del proyecto','url','https://xxxx.supabase.co')}${f('sbKey','Clave anon (pública)','text')}
        <div class="g2"><label class="fl">Email<input id="sbEmail" type="email" value="${esc(s.email)}"></label><label class="fl">Contraseña<input id="sbPass" type="password"></label></div>

function readSettings(){
  document.querySelectorAll('[data-k]').forEach(el => {
    const k = el.dataset.k; let v = el.type === 'checkbox' ? el.checked : el.value;
    if (['cuotaAutonomo','irpfDefecto'].includes(k)) v = +v || 0;
    S.settings[k] = v;
  });
}
function saveSettings(){ readSettings(); save(); toast('Ajustes guardados'); }
async function cloudLogin(){
  readSettings(); save(true);
  if (!Cloud.url || !Cloud.key) return toast('Falta la URL o la clave');
  try { await Cloud.login($('#sbEmail').value.trim().toLowerCase(), $('#sbPass').value); toast('Conectado'); await Cloud.sync(); render(); }
  catch(e){ const m = e.message === 'Failed to fetch' || e.message === 'Load failed' ? 'No se encuentra el proyecto: revisa la URL' : e.message; modal(`<div class="hd"><h2>No se pudo conectar</h2><button class="btn ghost sm" onclick="closeModal()">✕</button></div><p style="line-height:1.5">${esc(m)}</p>`); }
}

/* ============ Exportar / importar ============ */
function download(name, text, type){
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
  catch(e){ copyText(text); }
}
function exportJSON(){ const d = structuredClone(S); d.settings.sbKey = ''; download(`almara-gestion-${today()}.json`, JSON.stringify(d, null, 1), 'application/json'); }
function importJSON(file){
  if (!file) return; const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!Array.isArray(d.facturas)) throw 0;
    confirmBox(`Se cargarán ${d.facturas.length} facturas y ${d.gastos?.length || 0} gastos y se sustituirá lo que tienes ahora. ¿Seguir?`, () => { const keep = {sbUrl:S.settings.sbUrl, sbKey:S.settings.sbKey}; S = d; S.settings = Object.assign({}, DEFAULT.settings, d.settings, keep); S.gastos ||= []; save(); toast('Copia restaurada'); });
  } catch(e){ toast('Archivo no válido'); } };
  r.readAsText(file);
}
function exportCSV(kind){
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`, n = v => String(r2(v)).replace('.', ',');
  let rows;
  if (kind === 'facturas'){
    rows = [['Número','Fecha','Cliente','NIF','Base','IVA','Retención','Total','Estado']];
    S.facturas.filter(f => yOf(f.fecha) === YEAR).sort((a,b) => a.fecha.localeCompare(b.fecha)).forEach(f => { const t = facTotals(f); rows.push([f.num, fdate(f.fecha), f.cliente.nombre, f.cliente.nif, n(t.base), n(t.cuota), n(t.ret), n(t.total), f.estado]); });
  } else {
    rows = [['Fecha','Proveedor','NIF','Nº factura','Concepto','Categoría','Base','% IVA','Cuota IVA','IVA deducible','Gasto IRPF','Total']];
    S.gastos.filter(g => yOf(g.fecha) === YEAR).sort((a,b) => a.fecha.localeCompare(b.fecha)).forEach(g => { const t = gasTotals(g); rows.push([fdate(g.fecha), g.proveedor, g.nif, g.num, g.concepto, g.cat, n(t.base), g.iva, n(t.cuota), n(t.ivaDed), n(t.gastoIrpf), n(t.total)]); });
  }
  download(`${kind}-${YEAR}.csv`, '﻿' + rows.map(r => r.map(q).join(';')).join('\n'), 'text/csv');
}

    F(d(9,22), 'Construcciones Penedès S.L.', 'B11111111', [{c:'ICT edificio 12 viviendas', q:1, p:2400, iva:'isp'}], 'pendiente');
    const G = (fe, prov, con, cat, base, iva = 21, ivaDed = 100) => S.gastos.push({id:uid(), fecha:fe, proveedor:prov, nif:'', num:'', concepto:con + ' (ejemplo)', cat, base, iva, ivaDed, irpfDed:100});
    G(d(1,20), 'Obramat', 'Cable UTP y conectores', 'Material', 86.5);

    G(d(9,2), 'Würth', 'Brocas y taladro', 'Herramientas', 140);
    save(); toast('Datos de ejemplo cargados'); go('inicio');
  });
}

/* ============ Modal y diálogos ============ */
function modal(html){ $('#modalRoot').innerHTML = `<div class="ov" onclick="if(event.target===this)closeModal()"><div class="md">${html}</div></div>`; document.body.style.overflow = 'hidden'; }
function closeModal(){ $('#modalRoot').innerHTML = ''; document.body.style.overflow = ''; }
let _cb = null;
function confirmBox(msg, ok){
  _cb = ok; const prev = $('#modalRoot').innerHTML;
  const d = document.createElement('div'); d.className = 'ov'; d.style.zIndex = 60;
  d.innerHTML = `<div class="md" style="max-width:420px"><p style="margin-bottom:16px;line-height:1.5">${esc(msg)}</p><div class="ft"><span class="sp"></span><button class="btn ghost" id="cbNo">Cancelar</button><button class="btn" id="cbOk">Aceptar</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector('#cbNo').onclick = () => d.remove();
  d.querySelector('#cbOk').onclick = () => { d.remove(); ok(); };
}
function promptBox(label, ok){
  const d = document.createElement('div'); d.className = 'ov'; d.style.zIndex = 60;
  d.innerHTML = `<div class="md" style="max-width:420px"><label class="fl">${esc(label)}<input id="pbIn" type="number" inputmode="decimal" step="any"></label><div class="ft"><span class="sp"></span><button class="btn ghost" id="pbNo">Cancelar</button><button class="btn" id="pbOk">Aceptar</button></div></div>`;
  document.body.appendChild(d); d.querySelector('#pbIn').focus();
  d.querySelector('#pbNo').onclick = () => d.remove();
  d.querySelector('#pbOk').onclick = () => { const v = d.querySelector('#pbIn').value; d.remove(); ok(v); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ============ Arranque ============ */
function fromHash(){ const h = location.hash.slice(1); if (VIEWS.some(v => v[0] === h)) VIEW = h; }
window.addEventListener('hashchange', () => { fromHash(); render(); });
fromHash(); render();
if (Cloud.session) Cloud.sync();
